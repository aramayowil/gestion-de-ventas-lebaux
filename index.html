<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDC97D" />
    <meta name="description" content="Sistema de gestión de clientes, presupuestos, ventas y agenda de fábrica para Lebaux SRL." />
    <meta name="keywords" content="Lebaux, Aberturas, Presupuestos, Ventas, Agenda, Fábrica, Tucumán" />
    <meta name="author" content="Lebaux SRL" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/logo_recortado.png" />
    <title>Lebaux · Gestión de Aberturas</title>
    <!-- Script anti-FOUC: aplica el tema antes del primer render de React -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          var m = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (t === 'dark' || (!t && m)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="antialiased bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
