[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ─── Links cortos (acortador de PDFs para WhatsApp) ───
# /l/AB3XZ9 → función `l.ts`, que busca el código en Supabase y hace
# un 302 a la signed URL real.
#
# IMPORTANTE: usamos splat (/l/*) en vez de un placeholder con nombre
# (/l/:codigo) combinado con query string en el destino
# (?codigo=:codigo). Esa segunda forma es conocida por fallar en
# producción en Netlify —el placeholder no siempre se resuelve al
# armar el query string del destino, aunque funcione en netlify dev
# local— y el resultado es que el redirect no matchea y la request
# cae al catch-all de más abajo, sirviendo index.html en vez de
# ejecutar la función. Con /l/* → función/:splat, el código viaja en
# el PATH de la función (event.path), que sí es confiable, y la
# función lo extrae de ahí en vez de leerlo de queryStringParameters.
#
# Va ANTES del catch-all del SPA: los redirects de Netlify se evalúan
# en orden, y si el catch-all fuera primero se comería esta ruta.
[[redirects]]
  from = "/l/*"
  to = "/.netlify/functions/l/:splat"
  status = 200

# Fallback de SPA: cualquier ruta que no sea un archivo real del build
# (JS, CSS, imágenes) sirve index.html, para que React Router pueda
# resolver la URL del lado del cliente. Sin esto, refrescar en una ruta
# como /clientes/123 devuelve 404 porque ese archivo no existe en el
# servidor. Ya no hace falta con el HashRouter (que este proyecto dejó de
# usar), pero es obligatorio con BrowserRouter.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200